# Research-first defaults. See workflow.md for behavior.
# Journals remain available on request, never a required completion step.
session_auto_commit: false

# Main-session work by default; independent specialist work may be delegated.
codex:
  dispatch_mode: inline

# Optional lifecycle hooks; each receives TASK_JSON_PATH.
# hooks:
#   after_archive:
#     - "your-command"

# Optional package configuration; only declare real package/spec boundaries.
# packages:
#   algorithm:
#     path: algorithm
# default_package: algorithm

# Runtime safeguards, not a required collaboration workflow.
channel:
  worker_guard:
    idle_timeout: 5m
    max_live_workers: 6

# Optional context manifests are bounded when used by specialist workers.
# context_injection:
#   max_file_bytes: 32768
#   max_artifact_bytes: 65536
#   max_total_bytes: 131072

# prompt_injection:
#   skip_keyword: "no-trellis"
